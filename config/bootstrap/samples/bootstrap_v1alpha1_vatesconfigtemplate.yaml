apiVersion: bootstrap.cluster.x-k8s.io/v1alpha1
kind: VatesConfigTemplate
metadata:
  name: vatesconfigtemplate-sample
spec:
  template:
    spec:
      kubernetesVersion: v1.31.4
      network:
        iface: eth0
        mode: dhcp
      cni:
        # flannel (default) | cilium, both installed by the node, or none to
        # leave the CNI to the operator.
        plugin: flannel
        cidr: 10.244.0.0/16
