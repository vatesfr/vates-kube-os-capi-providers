---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: vatesconfigs.bootstrap.cluster.x-k8s.io
spec:
  group: bootstrap.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: VatesConfig
    listKind: VatesConfigList
    plural: vatesconfigs
    shortNames:
    - vbc
    singular: vatesconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.dataSecretName
      name: DataSecret
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VatesConfig is the Schema for the vatesconfigs API. One
          object is created per Machine, and the provider turns it into the
          vates-node.yaml user-data the machine reads at first boot.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VatesConfigSpec is the desired configuration of a Vates Kube OS
              machine. It is the CAPI-facing shape of the vates-node.yaml document the node
              reads at first boot: the provider fills in what it can derive from the owner
              Cluster and Machine (role, Kubernetes version, control plane endpoint) and
              renders the rest from here.

              The fields mirror github.com/vatesfr/vates-kube-os/vatescfg one for one. That
              package stays the single source of truth for the semantics and the validation:
              this spec is encoded into a vatescfg.Config and validated by it before a node
              ever sees the document.
            properties:
              api:
                description: API configures the node's management API.
                properties:
                  port:
                    description: |-
                      Port is the TCP port the management API listens on. Optional; defaults
                      to 50000.
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              binaries:
                description: Binaries says where the Kubernetes binaries come from.
                properties:
                  base:
                    description: |-
                      Base is the prefix the Kubernetes layout hangs under. Optional; empty
                      means https://dl.k8s.io/release.
                    type: string
                type: object
              cloud:
                description: Cloud is the node's relationship with an external cloud
                  provider.
                properties:
                  manifests:
                    description: |-
                      Manifests are applied by the bootstrap once the kubelet is up. Each entry
                      is an http(s) URL.
                    items:
                      type: string
                    type: array
                  provider:
                    description: |-
                      Provider is the external provider the kubelet defers to. Only "external"
                      is accepted.
                    enum:
                    - external
                    type: string
                type: object
              cluster:
                description: |-
                  Cluster carries the cluster-level settings that cannot be derived from
                  the CAPI objects.
                properties:
                  caCertHash:
                    description: |-
                      CACertHash is the sha256 of the cluster's CA certificate. Required with
                      certificateKey.
                    type: string
                  certificateKey:
                    description: |-
                      CertificateKey is kubeadm's --certificate-key, for a joining control
                      plane. It expires (kubeadm gives it two hours), so the provider must fetch
                      it when the machine is about to be created, never store it.
                    type: string
                  controlPlaneEndpoint:
                    description: |-
                      ControlPlaneEndpoint overrides the owner Cluster's
                      spec.controlPlaneEndpoint. Optional; normally left empty so the endpoint
                      comes from the Cluster.
                    type: string
                  dnsDomain:
                    description: |-
                      DNSDomain is the cluster's DNS domain. Optional; defaults to
                      "cluster.local".
                    type: string
                  proxy:
                    description: Proxy controls kube-proxy, which kubeadm installs
                      with its addons.
                    properties:
                      disabled:
                        description: |-
                          Disabled omits kube-proxy, for a CNI that replaces it in eBPF. It is only
                          valid with cni.plugin: none: flannel and cilium, as the node installs
                          them, run alongside kube-proxy and do not replace it.
                        type: boolean
                    type: object
                  serviceCIDR:
                    description: |-
                      ServiceCIDR is the range Service addresses are allocated from. Optional;
                      defaults to kubeadm's 10.96.0.0/12.
                    type: string
                  token:
                    description: |-
                      Token is the kubeadm bootstrap token, "abcdef.0123456789abcdef". Required
                      for a worker, which uses it to join. Optional on a master, which creates
                      the cluster instead of joining it.
                    type: string
                  vip:
                    description: VIP makes this control plane node participate in
                      owning a virtual IP.
                    properties:
                      address:
                        description: Address is the virtual address to own, e.g. "192.168.1.10".
                        type: string
                      interface:
                        description: |-
                          Interface is the interface to announce on. Optional; defaults to the
                          node's network interface.
                        type: string
                    type: object
                type: object
              cni:
                description: CNI selects the pod network.
                properties:
                  cidr:
                    description: CIDR is the pod network, e.g. "10.244.0.0/16". Required.
                    type: string
                  plugin:
                    description: |-
                      Plugin is the CNI implementation. Optional; defaults to "flannel". Both
                      "flannel" and "cilium" are installed by the node itself -- an embedded,
                      pinned manifest the node applies at first boot -- and both run alongside
                      kube-proxy. "none" leaves the CNI to the operator, which is how a CNI
                      that replaces kube-proxy is installed.
                    enum:
                    - flannel
                    - cilium
                    - none
                    type: string
                required:
                - cidr
                type: object
              dashboard:
                description: Dashboard is what the machine shows on its console.
                properties:
                  mode:
                    description: Mode is "tui" or "gui". Optional; defaults to "gui".
                    enum:
                    - tui
                    - gui
                    type: string
                type: object
              kubernetesVersion:
                description: |-
                  KubernetesVersion is the Kubernetes release to run, e.g. "v1.31.0".
                  Optional: when empty the owner Cluster's spec.topology.version is used.
                type: string
              network:
                description: Network is the node's own addressing.
                properties:
                  cidr:
                    description: CIDR is the node address in CIDR form. Required when
                      mode is static.
                    type: string
                  dns:
                    description: DNS is an optional list of resolvers.
                    items:
                      type: string
                    type: array
                  gateway:
                    description: Gateway is the default route. Required when mode
                      is static.
                    type: string
                  iface:
                    description: Iface is the network interface to configure, e.g.
                      "eth0".
                    type: string
                  mode:
                    description: Mode is "dhcp" or "static".
                    enum:
                    - dhcp
                    - static
                    type: string
                required:
                - iface
                - mode
                type: object
              registry:
                description: Registry says where this node's container images come
                  from.
                properties:
                  kubernetes:
                    description: |-
                      Kubernetes is the base for the cluster's own images. Optional; empty
                      means registry.k8s.io.
                    type: string
                  mirrors:
                    description: Mirrors rewrite the other images.
                    items:
                      description: VatesRegistryMirror redirects one upstream host
                        to a mirror.
                      properties:
                        host:
                          description: Host is the upstream registry, e.g. "ghcr.io".
                          type: string
                        replace:
                          description: Replace is where that host's images are found
                            instead, without a scheme.
                          type: string
                      required:
                      - host
                      - replace
                      type: object
                    type: array
                type: object
              time:
                description: Time is how the node keeps its clock.
                properties:
                  servers:
                    description: |-
                      Servers are the NTP servers to synchronize from. Optional; falls back to
                      the public pool.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - cni
            - network
            type: object
          status:
            description: |-
              VatesConfigStatus is the state of the bootstrap, as observed by the
              provider. The provider sets DataSecretName once the document is written; under
              the Cluster API contract the Machine controller reads status.dataSecretName
              and status.initialization.dataSecretCreated.
            properties:
              conditions:
                description: Conditions describe the current state of the bootstrap
                  configuration.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataSecretName:
                description: DataSecretName is the name of the Secret that holds the
                  bootstrap data.
                type: string
              failureMessage:
                description: FailureMessage is the last failure's human-readable detail.
                type: string
              failureReason:
                description: FailureReason is a one-word CamelCase reason for the
                  last failure.
                type: string
              initialization:
                description: Initialization tracks whether the bootstrap data Secret
                  has been created.
                properties:
                  dataSecretCreated:
                    description: |-
                      DataSecretCreated is true when the bootstrap data Secret has been
                      created. It is never unset once true.
                    type: boolean
                type: object
              ready:
                description: |-
                  Ready is true once the bootstrap data Secret exists. Kept for the
                  v1beta1 bootstrap contract; v1beta2 clients read Initialization instead.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
