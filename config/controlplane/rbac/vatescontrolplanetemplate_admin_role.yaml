# This rule is not used by the project vates-kube-os-control-plane-provider itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over controlplane.cluster.x-k8s.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vates-kube-os-control-plane-provider
    app.kubernetes.io/managed-by: kustomize
  name: vatescontrolplanetemplate-admin-role
rules:
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - vatescontrolplanetemplates
  verbs:
  - '*'
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - vatescontrolplanetemplates/status
  verbs:
  - get
